<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Extraction Royale damage map</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101a1c;color:#ecf4f0;font:16px/1.45 system-ui,sans-serif}main{max-width:1150px;margin:auto;padding:clamp(12px,3vw,34px)}h1{font-size:clamp(28px,4vw,48px);letter-spacing:-.045em;margin:0}p{margin:.2em 0 .6em;color:#c3d1cb}.bar{display:flex;align-items:center;gap:.65em;flex-wrap:wrap;margin:12px 0}label{white-space:nowrap}button,select{font:inherit;color:inherit;background:#26383b;border:1px solid #54686a;border-radius:5px;padding:5px 10px}select{max-width:100%}#view{height:min(67vh,830px);min-height:310px;overflow:auto;border:1px solid #657778;position:relative;background:#0e181a}#map{position:relative;width:min(100%,67vh);margin:auto;aspect-ratio:1;background:url(terrain.webp) center/100% 100%}#map button{position:absolute;transform:translate(-50%,-50%);padding:0;line-height:1;border:0;cursor:pointer}.C{width:18px;height:18px;background:#ffcf68;color:#161d22;border-radius:50%;font-weight:750;font-size:10px;z-index:1;box-shadow:0 0 0 1px #33250c}.T{width:9px;height:9px;background:#7af3cf;clip-path:polygon(50% 0,100% 100%,0 100%)}#map button.sel{z-index:3;outline:3px solid white;outline-offset:2px}.T.sel{clip-path:none}.keyC{color:#ffcf68}.keyT{color:#7af3cf}a{color:#ffdc8d}#detail{padding:.65em 0;min-height:3em}#detail strong{display:block}</style>
<main><h1>Extraction Royale damage map</h1><p>Select a marker for its Unity coordinates, tile and review image. Zoom in to separate nearby trees.</p>
<div class="bar"><label class="keyC"><input id="C" type="checkbox" checked> 80 craters ●</label><label class="keyT"><input id="T" type="checkbox" checked> 230 snapped trees ▲</label></div>
<div class="bar"><select id="pick" aria-label="Find a location"><option value="">Find a location</option></select><button id="plus" aria-label="Zoom in">+</button><button id="minus" aria-label="Zoom out">−</button><button id="reset">Fit map</button></div>
<div id="view"><div id="map"></div></div><div id="detail" aria-live="polite">Choose a crater or tree.</div></main>
<script src="points-80.js"></script><script>
const el=id=>document.getElementById(id),view=el('view'),map=el('map'),pick=el('pick'),byId=new Map();let zoom=1,selection=null;
function resize(z,u=.5,v=.5){zoom=Math.max(1,Math.min(16,z));let w=Math.min(view.clientWidth,view.clientHeight)*zoom;map.style.width=w+'px';view.scrollLeft=w*u-view.clientWidth/2;view.scrollTop=w*v-view.clientHeight/2}
function scale(factor){const wr=view.getBoundingClientRect(),mr=map.getBoundingClientRect();resize(zoom*factor,(wr.left+view.clientWidth/2-mr.left)/mr.width,(wr.top+view.clientHeight/2-mr.top)/mr.height)}
function selectPoint(p,focus){let key=p.type+p.id;el(p.type).checked=true;filter();if(selection)selection.classList.remove('sel');selection=byId.get(key);selection.classList.add('sel');pick.value=key;if(focus)resize(Math.max(zoom,4),p.u/100,p.v/100);let name=document.createElement('strong'),link=document.createElement('a');name.textContent=(p.type==='C'?'Crater ':'Tree ')+p.id+' · '+p.title;link.href=p.link;link.textContent=p.type==='C'?'See crater screenshot':'See tree break design';el('detail').replaceChildren(name,document.createTextNode('Tile '+p.tile+' · X '+p.x.toFixed(1)+' · Z '+p.z.toFixed(1)+' · '),link)}
function filter(){for(const p of points){const key=p.type+p.id;byId.get(key).hidden=!el(p.type).checked}}
for(const p of points){let key=p.type+p.id,label=(p.type==='C'?'Crater ':'Tree ')+p.id,b=document.createElement('button');b.className=p.type;b.style.left=p.u+'%';b.style.top=p.v+'%';b.title=label;b.setAttribute('aria-label',label);if(p.type==='C')b.textContent=p.id;b.onclick=()=>selectPoint(p,false);map.append(b);byId.set(key,b);pick.add(new Option(label+' · '+p.title.split(' · ')[0],key))}
pick.onchange=()=>{const p=points.find(p=>p.type+p.id===pick.value);if(p)selectPoint(p,true)};el('T').onchange=el('C').onchange=filter;el('plus').onclick=()=>scale(2);el('minus').onclick=()=>scale(.5);el('reset').onclick=()=>resize(1);resize(1);
</script></html>
